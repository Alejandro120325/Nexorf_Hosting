<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hosting Nexorf - Cuenta Creada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff073a;       /* Rojo Neón */
      --text-main: #ffffff;
      --text-muted: #ffccd5;    /* Rosado pálido */
      --card-bg: rgba(0, 0, 0, 0.75); /* Fondo un poco más oscuro para contraste */
      --card-border: rgba(255, 7, 58, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes fluirFondo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Animación de entrada suave */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: 'Inter', sans-serif; /* Fuente principal limpia */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(-60deg, #b00000, #000000, #8a0000); /* Rojo un poco más profundo */
      background-size: 400% 400%;
      color: var(--text-main);
      animation: fluirFondo 10s ease infinite;
    }

    .content-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      padding: 3rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(255, 7, 58, 0.15); /* Resplandor rojo suave */
      text-align: center;

      /* Animación de entrada */
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .logo-main {
      max-width: 80%;
      height: auto;
      max-height: 120px;
      vertical-align: middle;
      filter: drop-shadow(0 0 15px rgba(255,7,58,0.5));
      margin-bottom: 2.5rem;
      transition: transform 0.3s ease;
    }
    .logo-main:hover { transform: scale(1.03); }

    /* ESTILO MENSAJE DE ÉXITO */
    .success-message {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      margin-bottom: 2rem;
      text-align: left;

      /* Retraso de animación para que salga después de la tarjeta */
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.3s forwards;
    }

    .success-message span {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Icono SVG Check */
    .icon-check {
      width: 32px;
      height: 32px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px var(--primary));
    }

    /* CAJA DE INFO */
    .info-box {
      background: linear-gradient(180deg, rgba(255, 7, 58, 0.05), rgba(0, 0, 0, 0.2));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      text-align: left;
      margin-bottom: 2rem;

      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.5s forwards;
    }

    .info-item {
      margin-bottom: 1.2rem;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--text-muted);
    }
    .info-item:last-child { margin-bottom: 0; }

    /* Iconos generales SVG */
    .icon-svg {
      width: 20px;
      height: 20px;
      stroke: var(--primary); /* Color rojo neón para los iconos */
      stroke-width: 2;
      fill: none;
      flex-shrink: 0;
    }

    /* Etiquetas (Directorio web:, etc) */
    .label {
      font-weight: 600;
      color: #fff;
      margin-right: 5px;
    }

    code {
      background: rgba(255, 7, 58, 0.15);
      border: 1px solid rgba(255, 7, 58, 0.3);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(255, 7, 58, 0.1);
    }

    /* FOOTER */
    footer {
      width: 100%;
      background: rgba(5, 0, 0, 0.95);
      padding: 3rem 1.5rem 1rem;
      border-top: 1px solid var(--card-border);
      text-align: center;
      margin-top: auto;
    }

    .footer-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4rem;
      margin-bottom: 2rem;
    }

    .footer-section h4 {
      font-family: 'Rajdhani', sans-serif;
      color: var(--primary);
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255,7,58,0.3);
    }

    .footer-section p {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .footer-section a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer-section a:hover { color: var(--primary); text-shadow: 0 0 8px var(--primary); }

    .footer-bottom {
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 7, 58, 0.15);
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

</html>
